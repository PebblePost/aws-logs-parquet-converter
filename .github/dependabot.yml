version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
      timezone: America/New_York
    groups:
      python-packages:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    reviewers:
      - "andysnowden"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
